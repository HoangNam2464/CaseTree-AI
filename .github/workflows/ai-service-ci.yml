name: AI Service CI

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "fix/**"
    paths:
      - "ai-service/**"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "ai-service/**"

jobs:
  test:
    name: FastAPI Tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: ai-service
        run: pytest --cov=app --cov-report=xml -v
        env:
          AI_SERVICE_API_KEY: ci-test-key
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ci-fake-key-not-called-in-unit-tests
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: casetree_ai
          POSTGRES_USER: casetree
          POSTGRES_PASSWORD: test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-service-coverage
          path: ai-service/coverage.xml
