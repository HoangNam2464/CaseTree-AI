# ==============================================================================
# CaseTree AI — Local Development Infrastructure
# ==============================================================================
# Starts infrastructure services only:
#   - PostgreSQL 16 + pgvector   (business data + vector embeddings)
#   - Redis 7                    (caching, session store)
#   - MinIO                      (object storage for PDF/DOCX materials)
#
# Application services (NestJS Gateway, FastAPI AI Service, React Frontend) are run locally
# during development for hot-reload convenience.
#
# Usage:
#   docker compose up -d          # start all infrastructure
#   docker compose down           # stop all infrastructure
#   docker compose down -v        # stop and remove volumes (data loss!)
# ==============================================================================

services:

  # ============================================================================
  # PostgreSQL 16 + pgvector
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: casetree_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casetree_ai}
      POSTGRES_USER: ${POSTGRES_USER:-casetree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_db_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casetree} -d ${POSTGRES_DB:-casetree_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - casetree_network

  # ============================================================================
  # Redis 7
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: casetree_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-changeme_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - casetree_network

  # ============================================================================
  # MinIO — Object Storage for Teaching Materials (PDF/DOCX)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: casetree_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_minio_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - casetree_network

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

# ==============================================================================
# Networks
# ==============================================================================
networks:
  casetree_network:
    driver: bridge
    name: casetree_network
